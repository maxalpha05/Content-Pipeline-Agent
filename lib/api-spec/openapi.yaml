openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: pipeline
    description: Content pipeline operations
  - name: episodes
    description: Episode management operations
  - name: competitive-intelligence
    description: Competitive intelligence records captured from clip pipeline runs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /episodes:
    get:
      operationId: listEpisodes
      tags: [episodes]
      summary: List all episodes
      responses:
        "200":
          description: List of episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Episode"
    post:
      operationId: createEpisode
      tags: [episodes]
      summary: Create a new episode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEpisodeBody"
      responses:
        "201":
          description: Created episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
  /episodes/{id}:
    get:
      operationId: getEpisode
      tags: [episodes]
      summary: Get an episode with its clip runs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Episode with runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
    patch:
      operationId: updateEpisode
      tags: [episodes]
      summary: Update an episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEpisodeBody"
      responses:
        "200":
          description: Updated episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
    delete:
      operationId: deleteEpisode
      tags: [episodes]
      summary: Delete an episode and all its clip runs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
  /episodes/{id}/discover-clips:
    post:
      operationId: discoverClips
      tags: [episodes]
      summary: Scan the full transcript and return 4-6 recommended clip-worthy moments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discovery output stored on the episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverClipsResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
  /episodes/{id}/full-episode:
    post:
      operationId: runFullEpisode
      tags: [episodes]
      summary: Run the full episode pipeline using the stored transcript (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SSE stream of pipeline progress
          content:
            text/event-stream: {}
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
  /pipeline/runs:
    get:
      operationId: listPipelineRuns
      tags: [pipeline]
      summary: List all pipeline runs
      responses:
        "200":
          description: List of pipeline runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineRun"
    post:
      operationId: createPipelineRun
      tags: [pipeline]
      summary: Create and start a new pipeline run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePipelineRunBody"
      responses:
        "201":
          description: Created pipeline run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRun"
  /pipeline/runs/{id}:
    get:
      operationId: getPipelineRun
      tags: [pipeline]
      summary: Get a pipeline run with all outputs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pipeline run with outputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
    delete:
      operationId: deletePipelineRun
      tags: [pipeline]
      summary: Delete a pipeline run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
  /pipeline/runs/{id}/stream:
    get:
      operationId: streamPipelineRun
      tags: [pipeline]
      summary: Stream pipeline progress (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SSE stream of pipeline progress
          content:
            text/event-stream: {}
  /pipeline/runs/{id}/feedback:
    post:
      operationId: submitFeedback
      tags: [pipeline]
      summary: Submit feedback on a specific output for Editor revision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackBody"
      responses:
        "200":
          description: SSE stream of revised output
          content:
            text/event-stream: {}
  /pipeline/runs/{id}/approve:
    post:
      operationId: approvePipelineRun
      tags: [pipeline]
      summary: Approve the final content package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
  /pipeline/runs/{id}/rerun:
    post:
      operationId: rerunPipelineRun
      tags: [pipeline]
      summary: Reset a pipeline run to pending so it can be re-processed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reset run
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                required:
                  - id
                  - status
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
  /competitive-intelligence:
    get:
      operationId: listCompetitiveIntelligence
      tags: [competitive-intelligence]
      summary: List competitive intelligence records
      parameters:
        - name: topicCluster
          in: query
          required: false
          schema:
            type: string
        - name: minQualityScore
          in: query
          required: false
          schema:
            type: integer
            default: 5
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of competitive intelligence rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitiveIntelligence"
  /competitive-intelligence/clusters:
    get:
      operationId: listCompetitiveIntelligenceClusters
      tags: [competitive-intelligence]
      summary: List distinct topic clusters with aggregates
      responses:
        "200":
          description: Cluster aggregates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitiveIntelligenceCluster"
  /competitive-intelligence/{pipelineRunId}:
    patch:
      operationId: updateCompetitiveIntelligenceTitleSignal
      tags: [competitive-intelligence]
      summary: Record which title the user copied
      parameters:
        - name: pipelineRunId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompetitiveIntelligenceTitleBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineError"
  /pipeline/dashboard:
    get:
      operationId: getPipelineDashboard
      tags: [pipeline]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineDashboard"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Episode:
      type: object
      properties:
        id:
          type: integer
        episodeName:
          type: string
        guestName:
          type: string
        fullTranscript:
          type: string
        status:
          type: string
          enum: [active, archived]
        clipCount:
          type: integer
        substackArticle:
          type: ["string", "null"]
        substackNote:
          type: ["string", "null"]
        linkedinPost:
          type: ["string", "null"]
        twitterPost:
          type: ["string", "null"]
        youtubeDescription:
          type: ["string", "null"]
        youtubeTags:
          type: ["string", "null"]
        titleVariations:
          type: ["string", "null"]
        discoveryOutput:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - episodeName
        - guestName
        - fullTranscript
        - status
        - clipCount
        - createdAt
        - updatedAt
    EpisodeRunCard:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        clipType:
          type: ["string", "null"]
        status:
          type: string
        title:
          type: ["string", "null"]
        clipTranscript:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - status
        - createdAt
    EpisodeDetail:
      allOf:
        - $ref: "#/components/schemas/Episode"
        - type: object
          properties:
            runs:
              type: array
              items:
                $ref: "#/components/schemas/EpisodeRunCard"
          required:
            - runs
    CreateEpisodeBody:
      type: object
      properties:
        episodeName:
          type: string
        guestName:
          type: string
        fullTranscript:
          type: string
          minLength: 100
      required:
        - episodeName
        - guestName
        - fullTranscript
    UpdateEpisodeBody:
      type: object
      properties:
        episodeName:
          type: string
        guestName:
          type: string
        fullTranscript:
          type: string
        status:
          type: string
          enum: [active, archived]
        substackArticle:
          type: ["string", "null"]
        substackNote:
          type: ["string", "null"]
        linkedinPost:
          type: ["string", "null"]
        twitterPost:
          type: ["string", "null"]
        youtubeDescription:
          type: ["string", "null"]
        youtubeTags:
          type: ["string", "null"]
        titleVariations:
          type: ["string", "null"]
    PipelineRun:
      type: object
      properties:
        id:
          type: integer
        episodeId:
          type: ["integer", "null"]
        type:
          type: string
          enum: [episode, clip]
        clipType:
          type: ["string", "null"]
          enum: [vertical, horizontal, null]
        status:
          type: string
          enum: [pending, researching, analyzing, writing, editing, review, approved, failed]
        title:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - status
        - createdAt
        - updatedAt
    PipelineRunDetail:
      type: object
      properties:
        id:
          type: integer
        episodeId:
          type: ["integer", "null"]
        type:
          type: string
          enum: [episode, clip]
        clipType:
          type: ["string", "null"]
          enum: [vertical, horizontal, null]
        status:
          type: string
          enum: [pending, researching, analyzing, writing, editing, review, approved, failed]
        title:
          type: ["string", "null"]
        episodeTranscript:
          type: string
        clipTranscript:
          type: ["string", "null"]
        analystOutput:
          type: ["string", "null"]
        researchOutput:
          type: ["string", "null"]
        surgeryOutput:
          type: ["string", "null"]
        writerOutput:
          type: ["string", "null"]
        editorOutput:
          type: ["string", "null"]
        feedbackHistory:
          type: ["string", "null"]
        youtubeData:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - status
        - episodeTranscript
        - createdAt
        - updatedAt
    CreatePipelineRunBody:
      type: object
      properties:
        type:
          type: string
          enum: [episode, clip]
        clipType:
          type: string
          enum: [vertical, horizontal]
        episodeTranscript:
          type: string
        clipTranscript:
          type: string
        episodeId:
          type: integer
          description: When provided, the episode's stored transcript is used and clip_count is incremented.
        suggestedTopicKeywords:
          type: string
          description: Optional. When provided (e.g. from Clip Discovery), bypasses keyword extraction for YouTube search and historical-context lookup. Empty or omitted preserves prior behavior.
      required:
        - type
    SubmitFeedbackBody:
      type: object
      properties:
        targetOutput:
          type: string
        feedback:
          type: string
      required:
        - targetOutput
        - feedback
    PipelineDashboard:
      type: object
      properties:
        totalRuns:
          type: integer
        episodeRuns:
          type: integer
        clipRuns:
          type: integer
        approvedRuns:
          type: integer
        pendingReviewRuns:
          type: integer
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/PipelineRun"
      required:
        - totalRuns
        - episodeRuns
        - clipRuns
        - approvedRuns
        - pendingReviewRuns
        - recentRuns
    CompetitiveIntelligence:
      type: object
      properties:
        id:
          type: integer
        pipelineRunId:
          type: integer
        episodeId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        topicKeywords:
          type: string
        topicCluster:
          type: ["string", "null"]
        clipType:
          type: string
        youtubeShorts:
          type: ["string", "null"]
        youtubeShortCount:
          type: ["integer", "null"]
        youtubeTopViews:
          type: ["integer", "null"]
        instagramData:
          type: ["string", "null"]
        tiktokData:
          type: ["string", "null"]
        linkedinData:
          type: ["string", "null"]
        twitterData:
          type: ["string", "null"]
        crossPlatformPatterns:
          type: ["string", "null"]
        constraintsRaw:
          type: ["string", "null"]
        systemTitle:
          type: ["string", "null"]
        systemTitleVariations:
          type: ["string", "null"]
        systemTags:
          type: ["string", "null"]
        systemHashtags:
          type: ["string", "null"]
        userSelectedTitle:
          type: ["string", "null"]
        userSelectedTitleIndex:
          type: ["integer", "null"]
        researchOutputRaw:
          type: ["string", "null"]
        dataQualityScore:
          type: integer
        sufficientData:
          type: boolean
      required:
        - id
        - pipelineRunId
        - createdAt
        - topicKeywords
        - clipType
        - dataQualityScore
        - sufficientData
    CompetitiveIntelligenceCluster:
      type: object
      properties:
        topicCluster:
          type: ["string", "null"]
        count:
          type: integer
        avgQualityScore:
          type: ["number", "null"]
      required:
        - count
    UpdateCompetitiveIntelligenceTitleBody:
      type: object
      properties:
        userSelectedTitle:
          type: string
        userSelectedTitleIndex:
          type: integer
      required:
        - userSelectedTitle
        - userSelectedTitleIndex
    DiscoverClipsResponse:
      type: object
      properties:
        episodeId:
          type: integer
        discoveryOutput:
          type: string
      required:
        - episodeId
        - discoveryOutput
    PipelineError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
